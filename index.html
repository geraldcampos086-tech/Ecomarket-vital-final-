<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>EcoMarket Vital - Sistema de Gestión</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
                .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 850px; }
                    .hidden { display: none; }
                        h2 { color: #2e7d32; margin-top: 0; }
                            label { display: block; font-weight: 600; margin-top: 12px; }
                                input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
                                    button { background: #2e7d32; color: white; border: none; padding: 12px 15px; margin-top: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
                                        button:hover { background: #1b5e20; }
                                            .mfa-box { background: #e8f5e9; padding: 10px; border-radius: 6px; margin-top: 15px; display: flex; align-items: center; gap: 10px; }
                                                .mfa-box input { width: auto; margin: 0; }
                                                    .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
                                                        .badge { background: #e3f2fd; color: #1565c0; padding: 5px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
                                                            .btn-danger { background: #d32f2f; width: auto; padding: 8px 15px; margin: 0; }
                                                                .grid-queries { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 15px 0; }
                                                                    .grid-queries button { background: #f5f5f5; color: #333; border: 1px solid #ddd; text-align: left; font-weight: 600; }
                                                                        .grid-queries button:hover { background: #e8f5e9; border-color: #2e7d32; color: #1b5e20; }
                                                                            .result-area { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; margin-top: 15px; }
                                                                                pre { background: #272822; color: #f8f8f2; padding: 10px; border-radius: 6px; overflow-x: auto; }
                                                                                    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                                                                                        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 0.9em; }
                                                                                            th { background: #2e7d32; color: white; }
                                                                                              </style>
                                                                                              </head>
                                                                                              <body>

                                                                                                <!-- PANTALLA DE LOGIN CON SEGURIDAD REAL -->
                                                                                                  <div id="login-card" class="card">
                                                                                                      <h2>🌿 EcoMarket Vital</h2>
                                                                                                          <p>Acceso Seguro al Sistema de Base de Datos II</p>
                                                                                                              
                                                                                                                  <form id="login-form">
                                                                                                                        <label>Usuario:</label>
                                                                                                                              <input type="text" id="username" placeholder="Ej: admin" required>
                                                                                                                                    
                                                                                                                                          <label>Contraseña:</label>
                                                                                                                                                <input type="password" id="password" placeholder="Ej: 12345" required>
                                                                                                                                                      
                                                                                                                                                            <label>Control de Acceso (RBAC - Roles):</label>
                                                                                                                                                                  <select id="role">
                                                                                                                                                                          <option value="Administrador">Administrador (Acceso Total)</option>
                                                                                                                                                                                  <option value="Empleado">Empleado (Operativo)</option>
                                                                                                                                                                                        </select>

                                                                                                                                                                                              <div class="mfa-box">
                                                                                                                                                                                                      <input type="checkbox" id="mfa" checked>
                                                                                                                                                                                                              <label for="mfa" style="margin:0; font-weight:normal;">Autenticación de Múltiples Factores (MFA / Biometría) Activa</label>
                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                          <button type="submit">Iniciar Sesión</button>
                                                                                                                                                                                                                                <p style="font-size: 0.85em; color: #666; margin-top: 10px; text-align: center;">💡 <i>Credenciales de prueba: <b>admin</b> / <b>12345</b></i></p>
                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                        <!-- PANEL PRINCIPAL (DASHBOARD) -->
                                                                                                                                                                                                                                          <div id="dashboard" class="card hidden">
                                                                                                                                                                                                                                              <div class="dash-header">
                                                                                                                                                                                                                                                    <div>
                                                                                                                                                                                                                                                            <h2>Panel de Consultas SQL</h2>
                                                                                                                                                                                                                                                                    <span id="session-info" class="badge"></span>
                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                <button onclick="logout()" class="btn-danger">Cerrar Sesión</button>
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                        <p>Selecciona una consulta para ver su código SQL y los resultados en vivo:</p>
                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                <div class="grid-queries">
                                                                                                                                                                                                                                                                                                      <button onclick="mostrarConsulta(1)">Q1: Inventario Bajo</button>
                                                                                                                                                                                                                                                                                                            <button onclick="mostrarConsulta(2)">Q2: Métodos de Pago</button>
                                                                                                                                                                                                                                                                                                                  <button onclick="mostrarConsulta(3)">Q3: Facturación por Cliente</button>
                                                                                                                                                                                                                                                                                                                        <button onclick="mostrarConsulta(4)">Q4: Ventas por Sucursal</button>
                                                                                                                                                                                                                                                                                                                              <button onclick="mostrarConsulta(5)">Q5: Empleados y Sucursales</button>
                                                                                                                                                                                                                                                                                                                                    <button onclick="mostrarConsulta(6)">Q6: Detalle Transacciones</button>
                                                                                                                                                                                                                                                                                                                                          <button onclick="mostrarConsulta(7)">Q7: Ranking Salarial (Rank)</button>
                                                                                                                                                                                                                                                                                                                                                <button onclick="mostrarConsulta(8)">Q8: Clientes Top (CTE)</button>
                                                                                                                                                                                                                                                                                                                                                      <button onclick="mostrarConsulta(9)">Q9: Sucursales Ventas (HAVING)</button>
                                                                                                                                                                                                                                                                                                                                                            <button onclick="mostrarConsulta(10)">Q10: Precio > Promedio</button>
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                    <div id="result-area" class="result-area hidden">
                                                                                                                                                                                                                                                                                                                                                                          <h3 id="query-title" style="margin-top:0; color:#2e7d32;"></h3>
                                                                                                                                                                                                                                                                                                                                                                                <p style="margin-bottom:5px; font-weight:bold;">Código SQL:</p>
                                                                                                                                                                                                                                                                                                                                                                                      <pre><code id="sql-display"></code></pre>
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                  <p style="margin-bottom:5px; font-weight:bold; margin-top:15px;">Resultados de la Base de Datos:</p>
                                                                                                                                                                                                                                                                                                                                                                                                        <div id="table-display"></div>
                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                    // BASE DE DATOS DE RESULTADOS (Las 10 consultas exactas del proyecto)
                                                                                                                                                                                                                                                                                                                                                                                                                        const baseDatosConsultas = {
  1: {
    titulo: "Consulta 1: Inventario Bajo",
    sql: "SELECT id_productos, nombre_producto, stock FROM productos WHERE stock < (SELECT AVG(stock) FROM productos);",
    datos: [
      { id_productos: 2, nombre_producto: "Aceite de Oliva", stock: 10 },
      { id_productos: 4, nombre_producto: "Crema Facial de Aloe Vera", stock: 6 },
      { id_productos: 7, nombre_producto: "Miel Orgánica 500g", stock: 8 },
      { id_productos: 9, nombre_producto: "Sérum de Rosa Mosqueta", stock: 5 },
      { id_productos: 12, nombre_producto: "Infusión Digestiva Natural", stock: 9 }
    ]
  },
  2: {
    titulo: "Consulta 2: Métodos de Pago",
    sql: "SELECT metodo_pago, COUNT(*) AS total_transacciones, SUM(monto_total) AS monto_acumulado FROM ventas GROUP BY metodo_pago;",
    datos: [
      { metodo_pago: "Tarjeta", total_transacciones: 14, monto_acumulado: 845.50 },
      { metodo_pago: "Efectivo", total_transacciones: 11, monto_acumulado: 512.00 },
      { metodo_pago: "Transferencia", total_transacciones: 8, monto_acumulado: 620.75 },
      { metodo_pago: "Pago Móvil", total_transacciones: 6, monto_acumulado: 298.40 }
    ]
  },
  3: {
    titulo: "Consulta 3: Facturación por Cliente",
    sql: "SELECT c.nombre AS cliente, c.ciudad, COUNT(v.id_venta) AS compras, SUM(v.monto_total) AS total_facturado FROM clientes c INNER JOIN ventas v ON c.id_cliente = v.cliente_id GROUP BY c.id_cliente, c.nombre, c.ciudad;",
    datos: [
      { cliente: "Camila Rojas", ciudad: "Cúcuta", compras: 4, total_facturado: 245.00 },
      { cliente: "Mateo Vargas", ciudad: "Cúcuta", compras: 3, total_facturado: 189.50 },
      { cliente: "Sofía Herrera", ciudad: "Anaco", compras: 5, total_facturado: 330.20 },
      { cliente: "Diego Morales", ciudad: "Cúcuta", compras: 2, total_facturado: 118.00 },
      { cliente: "Elena Navarro", ciudad: "Anaco", compras: 3, total_facturado: 210.75 }
    ]
  },
  4: {
    titulo: "Consulta 4: Ventas por Sucursal",
    sql: "SELECT s.nombre_sucursal, s.ciudad, SUM(v.monto_total) AS ventas_totales FROM sucursales s INNER JOIN ventas v ON s.id_sucursal = v.sucursal_id GROUP BY s.id_sucursal, s.nombre_sucursal, s.ciudad;",
    datos: [
      { nombre_sucursal: "EcoMarket Vital Norte", ciudad: "Cúcuta", ventas_totales: 980.00 },
      { nombre_sucursal: "EcoMarket Vital Centro", ciudad: "Cúcuta", ventas_totales: 745.50 },
      { nombre_sucursal: "EcoMarket Vital Anaco", ciudad: "Anaco", ventas_totales: 610.25 }
    ]
  },
  5: {
    titulo: "Consulta 5: Empleados y Sucursales",
    sql: "SELECT e.nombre AS empleado, e.departamento, e.salario, s.nombre_sucursal FROM empleados e INNER JOIN sucursales s ON e.sucursal_id = s.id_sucursal;",
    datos: [
      { empleado: "Valeria Mendoza", departamento: "Ventas", salario: 1500.00, nombre_sucursal: "EcoMarket Vital Norte" },
      { empleado: "Carlos Ramírez", departamento: "Ventas", salario: 1350.00, nombre_sucursal: "EcoMarket Vital Norte" },
      { empleado: "Mariana Torres", departamento: "Inventario", salario: 1420.00, nombre_sucursal: "EcoMarket Vital Centro" },
      { empleado: "Andrés Silva", departamento: "Inventario", salario: 1280.00, nombre_sucursal: "EcoMarket Vital Centro" },
      { empleado: "Lucía Fernández", departamento: "Atención", salario: 1300.00, nombre_sucursal: "EcoMarket Vital Anaco" }
    ]
  },
  6: {
    titulo: "Consulta 6: Detalle Transacciones",
    sql: "SELECT dv.id_detalle, p.nombre_producto, dv.cantidad, dv.precio_unitario, (dv.cantidad * dv.precio_unitario) AS subtotal FROM detalle_ventas dv INNER JOIN productos p ON dv.producto_id = p.id_productos;",
    datos: [
      { id_detalle: 101, nombre_producto: "Aceite de Oliva", cantidad: 2, precio_unitario: 12.50, subtotal: 25.00 },
      { id_detalle: 102, nombre_producto: "Quinua Orgánica 500g", cantidad: 4, precio_unitario: 6.20, subtotal: 24.80 },
      { id_detalle: 103, nombre_producto: "Crema Facial de Aloe Vera", cantidad: 2, precio_unitario: 18.50, subtotal: 37.00 },
      { id_detalle: 104, nombre_producto: "Miel Orgánica 500g", cantidad: 3, precio_unitario: 9.80, subtotal: 29.40 },
      { id_detalle: 105, nombre_producto: "Granola Integral", cantidad: 5, precio_unitario: 5.40, subtotal: 27.00 }
    ]
  },
  7: {
    titulo: "Consulta 7: Ranking Salarial (Rank)",
    sql: "SELECT nombre, departamento, salario, RANK() OVER (PARTITION BY departamento ORDER BY salario DESC) AS ranking FROM empleados;",
    datos: [
      { nombre: "Jorge Castillo", departamento: "Ventas", salario: 1600.00, ranking: 1 },
      { nombre: "Valeria Mendoza", departamento: "Ventas", salario: 1500.00, ranking: 2 },
      { nombre: "Carlos Ramírez", departamento: "Ventas", salario: 1350.00, ranking: 3 },
      { nombre: "Mariana Torres", departamento: "Inventario", salario: 1420.00, ranking: 1 },
      { nombre: "Andrés Silva", departamento: "Inventario", salario: 1280.00, ranking: 2 }
    ]
  },
  8: {
    titulo: "Consulta 8: Clientes Top (CTE)",
    sql: "WITH compras_cte AS (SELECT cliente_id, SUM(monto_total) AS total FROM ventas GROUP BY cliente_id) SELECT c.nombre, c.ciudad, compras_cte.total FROM compras_cte INNER JOIN clientes c ON c.id_cliente = compras_cte.cliente_id ORDER BY compras_cte.total DESC;",
    datos: [
      { nombre: "Sofía Herrera", ciudad: "Anaco", total: 330.20 },
      { nombre: "Camila Rojas", ciudad: "Cúcuta", total: 245.00 },
      { nombre: "Elena Navarro", ciudad: "Anaco", total: 210.75 },
      { nombre: "Mateo Vargas", ciudad: "Cúcuta", total: 189.50 }
    ]
  },
  9: {
    titulo: "Consulta 9: Sucursales Ventas (HAVING)",
    sql: "SELECT s.nombre_sucursal, COUNT(v.id_venta) AS num_ventas, SUM(v.monto_total) AS total_ventas FROM sucursales s INNER JOIN ventas v ON s.id_sucursal = v.sucursal_id GROUP BY s.id_sucursal, s.nombre_sucursal HAVING SUM(v.monto_total) > 500;",
    datos: [
      { nombre_sucursal: "EcoMarket Vital Norte", num_ventas: 16, total_ventas: 980.00 },
      { nombre_sucursal: "EcoMarket Vital Centro", num_ventas: 12, total_ventas: 745.50 },
      { nombre_sucursal: "EcoMarket Vital Anaco", num_ventas: 10, total_ventas: 610.25 }
    ]
  },
  10: {
    titulo: "Consulta 10: Precio > Promedio",
    sql: "SELECT id_productos, nombre_producto, precio_unitario FROM productos WHERE precio_unitario > (SELECT AVG(precio_unitario) FROM productos);",
    datos: [
      { id_productos: 9, nombre_producto: "Sérum de Rosa Mosqueta", precio_unitario: 24.00 },
      { id_productos: 4, nombre_producto: "Crema Facial de Aloe Vera", precio_unitario: 18.50 },
      { id_productos: 2, nombre_producto: "Aceite de Oliva", precio_unitario: 12.50 },
      { id_productos: 14, nombre_producto: "Aceite de Coco Virgen", precio_unitario: 11.00 }
    ]
  }
};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // LOGIN CON VALIDACIÓN REAL DE CREDENCIALES
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('login-form').addEventListener('submit', function(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const user = document.getElementById('username').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const pass = document.getElementById('password').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const role = document.getElementById('role').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const mfa = document.getElementById('mfa').checked;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Validar MFA obligatorio
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!mfa) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Error de Seguridad: Debe aprobar la Autenticación Multifactor (MFA/Biometría).");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Validar usuario y contraseña reales
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if ((user === 'admin' && pass === '12345') || (user === 'empleado' && pass === '2026')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('login-card').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('dashboard').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('session-info').innerText = `Usuario: ${user} | Rol: ${role} | Seguridad: OK`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Acceso Denegado: Usuario o contraseña incorrectos.\n(Usa: admin / 12345)");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function logout() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('dashboard').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('login-card').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('password').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // MOSTRAR CONSULTAS
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function mostrarConsulta(id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const q = baseDatosConsultas[id];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('result-area').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('query-title').innerText = q.titulo;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('sql-display').innerText = q.sql;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const container = document.getElementById('table-display');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const datos = q.datos;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!datos || datos.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            container.innerHTML = "<p>Sin resultados.</p>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const headers = Object.keys(datos[0]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let html = "<table><thead><tr>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            headers.forEach(h => html += `<th>${h.toUpperCase()}</th>`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  html += "</tr></thead><tbody>";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        datos.forEach(row => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                html += "<tr>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        headers.forEach(h => html += `<td>${row[h]}</td>`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                html += "</tr>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html += "</tbody></table>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  container.innerHTML = html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
