<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>EcoMarket Vital - Sistema de Gestión</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
                .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 850px; }
                    .hidden { display: none; }
                        h2 { color: #2e7d32; margin-top: 0; }
                            label { display: block; font-weight: 600; margin-top: 12px; }
                                input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
                                    button { background: #2e7d32; color: white; border: none; padding: 12px 15px; margin-top: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
                                        button:hover { background: #1b5e20; }
                                            .mfa-box { background: #e8f5e9; padding: 10px; border-radius: 6px; margin-top: 15px; display: flex; align-items: center; gap: 10px; }
                                                .mfa-box input { width: auto; margin: 0; }
                                                    .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
                                                        .badge { background: #e3f2fd; color: #1565c0; padding: 5px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
                                                            .btn-danger { background: #d32f2f; width: auto; padding: 8px 15px; margin: 0; }
                                                                .grid-queries { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 15px 0; }
                                                                    .grid-queries button { background: #f5f5f5; color: #333; border: 1px solid #ddd; text-align: left; font-weight: 600; }
                                                                        .grid-queries button:hover { background: #e8f5e9; border-color: #2e7d32; color: #1b5e20; }
                                                                            .result-area { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; margin-top: 15px; }
                                                                                pre { background: #272822; color: #f8f8f2; padding: 10px; border-radius: 6px; overflow-x: auto; }
                                                                                    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                                                                                        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 0.9em; }
                                                                                            th { background: #2e7d32; color: white; }
                                                                                              </style>
                                                                                              </head>
                                                                                              <body>

                                                                                                <!-- PANTALLA DE LOGIN CON SEGURIDAD REAL -->
                                                                                                  <div id="login-card" class="card">
                                                                                                      <h2>🌿 EcoMarket Vital</h2>
                                                                                                          <p>Acceso Seguro al Sistema de Base de Datos II</p>
                                                                                                              
                                                                                                                  <form id="login-form">
                                                                                                                        <label>Usuario:</label>
                                                                                                                              <input type="text" id="username" placeholder="Ej: admin" required>
                                                                                                                                    
                                                                                                                                          <label>Contraseña:</label>
                                                                                                                                                <input type="password" id="password" placeholder="Ej: 12345" required>
                                                                                                                                                      
                                                                                                                                                            <label>Control de Acceso (RBAC - Roles):</label>
                                                                                                                                                                  <select id="role">
                                                                                                                                                                          <option value="Administrador">Administrador (Acceso Total)</option>
                                                                                                                                                                                  <option value="Empleado">Empleado (Operativo)</option>
                                                                                                                                                                                        </select>

                                                                                                                                                                                              <div class="mfa-box">
                                                                                                                                                                                                      <input type="checkbox" id="mfa" checked>
                                                                                                                                                                                                              <label for="mfa" style="margin:0; font-weight:normal;">Autenticación de Múltiples Factores (MFA / Biometría) Activa</label>
                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                          <button type="submit">Iniciar Sesión</button>
                                                                                                                                                                                                                                <p style="font-size: 0.85em; color: #666; margin-top: 10px; text-align: center;">💡 <i>Credenciales de prueba: <b>admin</b> / <b>12345</b></i></p>
                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                        <!-- PANEL PRINCIPAL (DASHBOARD) -->
                                                                                                                                                                                                                                          <div id="dashboard" class="card hidden">
                                                                                                                                                                                                                                              <div class="dash-header">
                                                                                                                                                                                                                                                    <div>
                                                                                                                                                                                                                                                            <h2>Panel de Consultas SQL</h2>
                                                                                                                                                                                                                                                                    <span id="session-info" class="badge"></span>
                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                <button onclick="logout()" class="btn-danger">Cerrar Sesión</button>
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                        <p>Selecciona una consulta para ver su código SQL y los resultados en vivo:</p>
                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                <div class="grid-queries">
                                                                                                                                                                                                                                                                                                      <button onclick="mostrarConsulta(1)">Q1: Inventario Bajo</button>
                                                                                                                                                                                                                                                                                                            <button onclick="mostrarConsulta(2)">Q2: Métodos de Pago</button>
                                                                                                                                                                                                                                                                                                                  <button onclick="mostrarConsulta(3)">Q3: Facturación por Cliente</button>
                                                                                                                                                                                                                                                                                                                        <button onclick="mostrarConsulta(4)">Q4: Ventas por Sucursal</button>
                                                                                                                                                                                                                                                                                                                              <button onclick="mostrarConsulta(5)">Q5: Empleados y Sucursales</button>
                                                                                                                                                                                                                                                                                                                                    <button onclick="mostrarConsulta(6)">Q6: Detalle Transacciones</button>
                                                                                                                                                                                                                                                                                                                                          <button onclick="mostrarConsulta(7)">Q7: Ranking Salarial (Rank)</button>
                                                                                                                                                                                                                                                                                                                                                <button onclick="mostrarConsulta(8)">Q8: Clientes Top (CTE)</button>
                                                                                                                                                                                                                                                                                                                                                      <button onclick="mostrarConsulta(9)">Q9: Sucursales Ventas (HAVING)</button>
                                                                                                                                                                                                                                                                                                                                                            <button onclick="mostrarConsulta(10)">Q10: Precio > Promedio</button>
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                    <div id="result-area" class="result-area hidden">
                                                                                                                                                                                                                                                                                                                                                                          <h3 id="query-title" style="margin-top:0; color:#2e7d32;"></h3>
                                                                                                                                                                                                                                                                                                                                                                                <p style="margin-bottom:5px; font-weight:bold;">Código SQL:</p>
                                                                                                                                                                                                                                                                                                                                                                                      <pre><code id="sql-display"></code></pre>
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                  <p style="margin-bottom:5px; font-weight:bold; margin-top:15px;">Resultados de la Base de Datos:</p>
                                                                                                                                                                                                                                                                                                                                                                                                        <div id="table-display"></div>
                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                    // BASE DE DATOS DE RESULTADOS (Las 10 consultas exactas del proyecto)
                                                                                                                                                                                                                                                                                                                                                                                                                        const baseDatosConsultas = {
                                                                                                                                                                                                                                                                                                                                                                                                                              1: {
                                                                                                                                                                                                                                                                                                                                                                                                                                      titulo: "Consulta 1: Inventario Bajo",
                                                                                                                                                                                                                                                                                                                                                                                                                                              sql: "SELECT id_productos, nombre_producto, stock\nFROM productos\nWHERE stock < (SELECT AVG(stock) FROM productos);",
                                                                                                                                                                                                                                                                                                                                                                                                                                                      datos: [{ id_productos: 2, nombre_producto: "Aceite de Oliva", stock: 10 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                            },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  2: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          titulo: "Consulta 2: Métodos de Pago Preferidos",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  sql: "SELECT metodo_pago, COUNT(*) AS total_ventas\nFROM ventas\nGROUP BY metodo_pago;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          datos: [{ metodo_pago: "Efectivo", total_ventas: 1 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      3: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              titulo: "Consulta 3: Facturación por Cliente (INNER JOIN)",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      sql: "SELECT c.nombre_cliente, SUM(dv.subtotal) AS total_gastado\nFROM clientes c\nJOIN ventas v ON c.id_clientes = v.id_cliente\nJOIN detalle_ventas dv ON v.id_ventas = dv.id_ventas\nGROUP BY c.id_clientes, c.nombre_cliente;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              datos: [{ nombre_cliente: "Jose Campos", total_gastado: 24 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          4: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  titulo: "Consulta 4: Ventas por Sucursal (INNER JOIN)",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          sql: "SELECT s.nombre AS nombre_sucursal, s.ciudad, SUM(dv.cantidad) AS total_productos_vendidos\nFROM sucursales s\nJOIN ventas v ON s.id_sucursales = v.id_sucursal\nJOIN detalle_ventas dv ON v.id_ventas = dv.id_ventas\nGROUP BY s.id_sucursales, s.nombre, s.ciudad;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  datos: [{ nombre_sucursal: "Centro", ciudad: "Cúcuta", total_productos_vendidos: 2 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              5: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      titulo: "Consulta 5: Asignación de Empleados (INNER JOIN)",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              sql: "SELECT e.nombre_empleado, e.departamento, e.salario, s.nombre AS nombre_sucursal\nFROM empleados e\nJOIN sucursales s ON e.id_sucursal = s.id_sucursales;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      datos: [{ nombre_empleado: "Jose Perez", departamento: "Ventas", salario: 475, nombre_sucursal: "Centro" }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  6: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          titulo: "Consulta 6: Detalle de Transacciones Recientes",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  sql: "SELECT v.id_ventas, v.fecha, p.nombre_producto, dv.cantidad\nFROM ventas v\nJOIN detalle_ventas dv ON v.id_ventas = dv.id_ventas\nJOIN productos p ON dv.id_productos = p.id_productos;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          datos: [{ id_ventas: 1, fecha: "2026-11-10", nombre_producto: "Aceite de Oliva", cantidad: 2 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      7: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              titulo: "Consulta 7: Ranking de Empleados por Salario",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      sql: "SELECT nombre_empleado, departamento, salario,\n       RANK() OVER (PARTITION BY departamento ORDER BY salario DESC) AS ranking_salario\nFROM empleados;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              datos: [{ nombre_empleado: "Jose Perez", departamento: "Ventas", salario: 475, ranking_salario: 1 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          8: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  titulo: "Consulta 8: Clientes Top con CTE",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          sql: "WITH FacturacionCliente AS (\n    SELECT c.id_clientes, c.nombre_cliente, SUM(dv.subtotal) AS total_gastado\n    FROM clientes c\n    JOIN ventas v ON c.id_clientes = v.id_cliente\n    JOIN detalle_ventas dv ON v.id_ventas = dv.id_ventas\n    GROUP BY c.id_clientes, c.nombre_cliente\n)\nSELECT id_clientes, nombre_cliente, total_gastado\nFROM FacturacionCliente\nWHERE total_gastado > 20;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  datos: [{ id_clientes: 1, nombre_cliente: "Jose Campos", total_gastado: 24 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              9: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      titulo: "Consulta 9: Sucursales con Ventas Acumuladas (HAVING)",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              sql: "SELECT s.nombre AS sucursal, s.ciudad, SUM(dv.subtotal) AS total_ventas\nFROM sucursales s\nJOIN ventas v ON s.id_sucursales = v.id_sucursal\nJOIN detalle_ventas dv ON v.id_ventas = dv.id_ventas\nGROUP BY s.id_sucursales, s.nombre, s.ciudad\nHAVING SUM(dv.subtotal) > 10;",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      datos: [{ sucursal: "Centro", ciudad: "Cúcuta", total_ventas: 24 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  10: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          titulo: "Consulta 10: Productos por Encima del Precio Promedio",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  sql: "SELECT p.nombre_producto, p.categorías, p.precio\nFROM productos p\nWHERE p.precio > (SELECT AVG(precio) FROM productos);",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          datos: [{ nombre_producto: "Aceite de Oliva", categorías: "Alimentos", precio: 8.5 }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // LOGIN CON VALIDACIÓN REAL DE CREDENCIALES
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('login-form').addEventListener('submit', function(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const user = document.getElementById('username').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const pass = document.getElementById('password').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const role = document.getElementById('role').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const mfa = document.getElementById('mfa').checked;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Validar MFA obligatorio
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!mfa) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Error de Seguridad: Debe aprobar la Autenticación Multifactor (MFA/Biometría).");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Validar usuario y contraseña reales
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if ((user === 'admin' && pass === '12345') || (user === 'empleado' && pass === '2026')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('login-card').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('dashboard').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('session-info').innerText = `Usuario: ${user} | Rol: ${role} | Seguridad: OK`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Acceso Denegado: Usuario o contraseña incorrectos.\n(Usa: admin / 12345)");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function logout() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('dashboard').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('login-card').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('password').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // MOSTRAR CONSULTAS
